emailVerificationSubject=ChargeOps - Xác minh email của bạn
emailVerificationBody=Chào bạn,\n\nTài khoản ChargeOps vừa được tạo bằng email này. Nếu đúng là bạn, hãy mở liên kết bên dưới để xác minh email:\n\n{0}\n\nLiên kết sẽ hết hạn trong {3}.\n\nNếu bạn không tạo tài khoản ChargeOps, vui lòng bỏ qua email này.
