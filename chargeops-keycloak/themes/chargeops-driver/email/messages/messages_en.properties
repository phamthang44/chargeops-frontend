emailVerificationSubject=ChargeOps - Verify your email
emailVerificationBody=Hi,\n\nA ChargeOps account was created with this email address. If this was you, open the link below to verify your email:\n\n{0}\n\nThis link will expire within {3}.\n\nIf you did not create a ChargeOps account, you can ignore this email.
emailVerificationBodyHtml=<p>Hi,</p><p>A ChargeOps account was created with this email address. If this was you, open the link below to verify your email.</p><p><a href="{0}">Verify email</a></p><p>This link will expire within {3}.</p><p>If you did not create a ChargeOps account, you can ignore this email.</p>

emailUpdateConfirmationSubject=ChargeOps - Verify your new email
emailUpdateConfirmationBody=Hi,\n\nYou requested to change your ChargeOps account email to {1}. Open the link below to verify the new email address:\n\n{0}\n\nThis link will expire within {3}.\n\nIf you did not request this change, you can ignore this email.
emailUpdateConfirmationBodyHtml=<p>Hi,</p><p>You requested to change your ChargeOps account email to <strong>{1}</strong>. Open the link below to verify the new email address.</p><p><a href="{0}">Verify new email</a></p><p>This link will expire within {3}.</p><p>If you did not request this change, you can ignore this email.</p>

passwordResetSubject=ChargeOps - Reset your password
passwordResetBody=Hi,\n\nChargeOps received a request to reset your account password. If this was you, open the link below to continue:\n\n{0}\n\nThis link will expire within {3}.\n\nIf you did not request a password reset, you can ignore this email. Your account will not be changed.
passwordResetBodyHtml=<p>Hi,</p><p>ChargeOps received a request to reset your account password. If this was you, open the link below to continue.</p><p><a href="{0}">Reset password</a></p><p>This link will expire within {3}.</p><p>If you did not request a password reset, you can ignore this email. Your account will not be changed.</p>

executeActionsSubject=ChargeOps - Account verification required
executeActionsBody=Hi,\n\nChargeOps needs you to complete these account actions: {3}.\n\nOpen the link below to continue:\n\n{0}\n\nThis link will expire within {4}.\n\nIf you do not recognize this request, you can ignore this email.
executeActionsBodyHtml=<p>Hi,</p><p>ChargeOps needs you to complete these account actions: <strong>{3}</strong>.</p><p><a href="{0}">Complete verification</a></p><p>This link will expire within {4}.</p><p>If you do not recognize this request, you can ignore this email.</p>

identityProviderLinkSubject=ChargeOps - Link your {0} account
identityProviderLinkBody=Hi,\n\nThere is a request to link your {0} account with the ChargeOps account for user {2}. If this was you, open the link below to confirm:\n\n{3}\n\nThis link will expire within {5}.\n\nIf you did not request account linking, you can ignore this email.
identityProviderLinkBodyHtml=<p>Hi,</p><p>There is a request to link your <strong>{0}</strong> account with the ChargeOps account for user <strong>{2}</strong>. If this was you, open the link below to confirm.</p><p><a href="{3}">Confirm account linking</a></p><p>This link will expire within {5}.</p><p>If you did not request account linking, you can ignore this email.</p>

