<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EAF7F1" />
    <title>ChargeOps</title>
    <style id="expo-reset">
      html, body { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #EAF7F1; -webkit-text-size-adjust: 100%; }
      #root { display: flex; flex: 1; width: 100%; height: 100%; }
      @supports (height: 100dvh) {
        html, body, #root { height: 100dvh; }
      }
      @media (hover: none) and (pointer: coarse) {
        /* Prevent Safari focus zoom from shifting the app's fixed controls. */
        input, textarea, select { font-size: 16px !important; }
      }
    </style>
  </head>
  <body>
    <noscript>Vui lòng bật JavaScript để sử dụng ChargeOps.</noscript>
    <div id="root"></div>
  </body>
</html>
